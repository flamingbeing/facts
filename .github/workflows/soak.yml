# Nightly soak (docs/ci or app-devkit README, "soak.yml"): the browser tests about 30 times, a third under a slow-phone
# profile, no retries, at 02:30 SGT. A failure opens or updates ONE issue titled "Nightly soak"; it closes after 7 clean
# nights. Not a required check, never blocks a PR. Also runs by hand (Actions, "Nightly soak", Run workflow).
name: Nightly soak
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  soak:
    uses: flamingbeing/app-devkit/.github/workflows/soak.yml@v1.13.7
    with:
      # cloud{
      emulators: firestore,auth
      # }cloud
      unit-command: node --test 'worker/test/*.test.mjs' 'app/test/*.unit.test.mjs' 'tools/test/*.test.mjs'
  full:
    uses: ./.github/workflows/full-checks.yml
