# Deploys the Worker on every push to main (app-devkit deploy-worker, exact pin). The build stamps the service worker
# (tools/stamp-versions.mjs). Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the run
# says so and skips. Never runs in the template repo itself.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository != 'flamingbeing/app-starter'
    uses: flamingbeing/app-devkit/.github/workflows/deploy-worker.yml@v1.11.0
    with:
      stamp-command: node tools/stamp-versions.mjs app
    secrets: inherit
