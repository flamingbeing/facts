<html lang="en" class="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <title>Facts</title>
  <script type="importmap">
{
  "imports": {
    "@core/app": "https://core.anawj.com/sync/1.5.5/app.js",
    "@core/auth": "https://core.anawj.com/sync/1.5.5/auth.js",
    "@core/sync": "https://core.anawj.com/sync/1.5.5/sync.js",
    "@core/update": "https://core.anawj.com/sync/1.5.5/update.js",
    "@core/ui": "https://core.anawj.com/ui/1.0.0-rc.40/ui/index.js",
    "@core/theme": "https://core.anawj.com/ui/1.0.0-rc.40/theme/index.js",
    "@core/settings": "https://core.anawj.com/ui/1.0.0-rc.40/settings/index.js",
    "app-update/register.js": "https://core.anawj.com/update/0.2.0/register.js",
    "firebase/app": "./vendor/firebase/12.19.0/firebase-app.js",
    "firebase/auth": "./vendor/firebase/12.19.0/firebase-auth.js",
    "firebase/firestore": "./vendor/firebase/12.19.0/firebase-firestore.js"
  }
}
  </script>
  <script src="https://core.anawj.com/ui/1.0.0-rc.40/theme/early.js"></script>
  <link rel="modulepreload" href="https://core.anawj.com/sync/1.5.5/app.js" data-module>
  <link rel="modulepreload" href="https://core.anawj.com/sync/1.5.5/auth.js" data-module>
  <link rel="modulepreload" href="https://core.anawj.com/sync/1.5.5/sync.js" data-module>
  <link rel="modulepreload" href="https://core.anawj.com/sync/1.5.5/update.js" data-module>
  <link rel="modulepreload" href="https://core.anawj.com/ui/1.0.0-rc.40/ui/index.js" data-module>
  <link rel="modulepreload" href="https://core.anawj.com/ui/1.0.0-rc.40/theme/index.js" data-module>
  <link rel="modulepreload" href="https://core.anawj.com/ui/1.0.0-rc.40/settings/index.js" data-module>
  <link rel="modulepreload" href="https://core.anawj.com/update/0.2.0/register.js" data-module>
  <link rel="modulepreload" href="./vendor/firebase/12.19.0/firebase-app.js" data-module>
  <link rel="modulepreload" href="./vendor/firebase/12.19.0/firebase-auth.js" data-module>
  <link rel="modulepreload" href="./vendor/firebase/12.19.0/firebase-firestore.js" data-module>
  <script type="module" src="src/boot.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://design.anawj.com/v1/tokens.css">
  <link rel="stylesheet" href="https://core.anawj.com/ui/1.0.0-rc.40/theme/theme.css">
  <link rel="stylesheet" href="https://core.anawj.com/ui/1.0.0-rc.40/ui/ui.css">
  <link rel="stylesheet" href="https://core.anawj.com/ui/1.0.0-rc.40/theme/glass.css">
  <link rel="stylesheet" href="https://core.anawj.com/ui/1.0.0-rc.40/ui/gestures.css">
  <link rel="stylesheet" href="https://core.anawj.com/ui/1.0.0-rc.40/ui/shell/shell.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <!-- The kit shell (ui/shell/shell.css): a bar and tab bar on a phone (the tabs are swipeable pages), a side bar from 600 px,
       the side bar as a drawer on a phone. src/shell.js starts it. A new app adds its pages as .ui-tab-page sections and a
       tab and a side link for each. -->
  <div class="ui-shell">
    <header class="ui-bar">
      <span class="ui-bar-side" data-bar-lead><button type="button" class="ui-bar-menu" aria-label="Menu" aria-controls="side">☰</button></span>
      <h2 class="ui-bar-title" aria-hidden="true">Facts</h2>
      <span class="ui-bar-side ui-bar-end"></span>
    </header>
    <!-- (the kit's shell looks for a .ui-list to watch; this app has no list, so it gets an empty one that never shows) -->
    <ul class="ui-list" hidden></ul>

    <nav class="ui-sidebar" id="side" aria-label="Sections">
      <p class="ui-sidebar-name"><img class="app-mark" src="icons/icon.svg" alt="" width="28" height="28">Facts</p>
      <a class="ui-side-link" href="./" data-tab-page="#align-page" aria-current="page">Align</a>
      <a class="ui-side-link" href="./" data-tab-page="#settings-page" id="side-settings">Settings</a>
    </nav>

    <main class="ui-screens">
      <section class="ui-screen ui-tab-page" id="align-page" aria-labelledby="align-title">
        <h1 class="ui-large-title" id="align-title">Align</h1>
        <!-- cloud{ sign-in, access and set-up: a static app has none (tools/flavour.mjs) -->
        <div id="signed-out" hidden>
          <img class="app-mark app-mark-big" src="icons/icon.svg" alt="" width="72" height="72">
          <p>Sign in to see the cards.</p>
          <div id="sign-in-sheet" class="sheet"></div>
        </div>
        <div id="no-access" hidden>
          <p>This account has no access yet. Ask an admin to add it.</p>
          <p class="small">Account id: <code id="uid"></code></p>
        </div>
        <div id="not-set-up" hidden>
          <p>This app isn't connected to its Firebase project yet (see README, "Fill").</p>
        </div>
        <!-- }cloud -->
        <div id="align-view" hidden>
          <div id="conflict-sheet"></div>
          <div id="refused-list"></div>
          <div id="align-areas" class="align-chips" role="group" aria-label="Area"></div>
          <input id="align-find" type="text" enterkeyhint="go" placeholder="Find topics and lines" aria-label="Find cards" autocomplete="off">
          <div class="align-countrow">
            <p id="align-count" class="small" role="status"></p>
            <!-- cloud{ the sync chip: a static app's answers are never unsent -->
            <span id="sync-chip"></span>
            <!-- }cloud -->
          </div>
          <div id="align-state"></div>
          <div id="align-deck" aria-label="Cards"></div>
          <div id="align-empty"></div>
        </div>
      </section>
      <section class="ui-screen ui-tab-page" id="settings-page" aria-labelledby="settings-title" hidden>
        <h1 class="ui-large-title" id="settings-title">Settings</h1>
        <!-- cloud{ -->
        <div id="account" class="status-line">
          <span id="who"></span>
          <button id="sign-out" type="button" hidden>Sign out</button>
          <p id="sign-out-msg" class="error" role="alert"></p>
        </div>
        <!-- }cloud -->
        <div id="settings-host"></div>
      </section>
    </main>

    <nav class="ui-tabbar" data-minimise aria-label="Sections">
      <button type="button" class="ui-tab" data-tab-page="#align-page" aria-current="page"><span class="ui-tab-icon" aria-hidden="true">⇄</span>Align</button>
      <button type="button" class="ui-tab" data-tab-page="#settings-page" id="tab-settings"><span class="ui-tab-icon" aria-hidden="true">≡</span>Settings</button>
    </nav>
  </div>

  <div id="toasts"></div>

  <dialog id="fix" aria-labelledby="fix-title">
    <form method="dialog">
      <h2 id="fix-title">What should it say?</h2>
      <p id="fix-where" class="small"></p>
      <label for="fix-text">The line</label>
      <textarea id="fix-text" rows="5" maxlength="2000" required></textarea>
      <div class="row">
        <button value="save">Save</button>
        <button value="cancel" formnovalidate>Cancel</button>
      </div>
    </form>
  </dialog>
</body>
</html>
